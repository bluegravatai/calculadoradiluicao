<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Diluição - Blue</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    <div class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-md">
        
        <!-- Topo com Imagem da Bombona e Título -->
        <div class="flex flex-col items-center mb-6">
            <img src="bombona.png" alt="Bombona Blue" class="h-28 object-contain mb-2" onerror="this.style.display='none'">
            <h1 class="text-2xl font-bold text-blue-600">Calculadora Blue</h1>
        </div>
        
        <!-- Tamanho da Embalagem -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Tamanho da Embalagem</label>
            <select id="packageSize" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="1000">1 Litro (1.000 ml)</option>
                <option value="5000" selected>5 Litros (5.000 ml)</option>
            </select>
        </div>

        <!-- Valor do Produto -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Valor do produto R$</label>
            <input type="number" id="productPrice" placeholder="Ex: 129.89" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" step="0.01">
        </div>

        <!-- Nível de Sujidade -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nível de Sujidade (Diluição)</label>
            <select id="dirtLevel" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                <option value="10">Baixa (1:100 - 10 ml/L)</option>
                <option value="20">Intermediária (1:50 - 20 ml/L)</option>
                <option value="50">Média (1:20 - 50 ml/L)</option>
                <option value="100">Alta (1:10 - 100 ml/L)</option>
            </select>
        </div>

        <!-- Volume Desejado da Solução -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Volume de Solução Desejado (Litros)</label>
            <input type="number" id="solutionVolume" placeholder="Ex: 5" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" step="0.1">
        </div>

        <button onclick="calculate()" class="w-full bg-blue-600 text-white p-2 rounded-lg font-semibold hover:bg-blue-700 transition">Calcular</button>

        <!-- Resultados -->
        <div id="results" class="mt-6 p-4 bg-blue-50 rounded-lg hidden">
            <h2 class="font-bold text-blue-800 mb-2">Resultado da Mistura:</h2>
            <p id="resPure" class="text-sm mb-1"></p>
            <p id="resWater" class="text-sm mb-1"></p>
            <p id="resCostPerLiter" class="text-sm mb-1"></p>
            <p id="resTotalCost" class="text-sm mb-1"></p>
            <p id="resYield" class="text-sm font-semibold text-blue-900 mt-2 pt-2 border-t border-blue-200"></p>
        </div>
    </div>

    <script>
        function calculate() {
            const packageSize = parseFloat(document.getElementById('packageSize').value);
            const price = parseFloat(document.getElementById('productPrice').value);
            const mlPerLiter = parseFloat(document.getElementById('dirtLevel').value);
            const desiredVolume = parseFloat(document.getElementById('solutionVolume').value);

            if (isNaN(price) || isNaN(desiredVolume) || price <= 0 || desiredVolume <= 0) {
                alert('Por favor, preencha todos os campos com valores válidos.');
                return;
            }

            // Cálculos para o lote desejado
            const pureNeededMl = desiredVolume * mlPerLiter;
            const waterNeededMl = (desiredVolume * 1000) - pureNeededMl;
            
            const waterLiters = Math.floor(waterNeededMl / 1000);
            const waterMl = Math.round(waterNeededMl % 1000);

            // Formatação da água em litros e mililitros
            let waterText = '';
            if (waterLiters > 0 && waterMl > 0) {
                waterText = `${waterLiters} litro${waterLiters > 1 ? 's' : ''} e ${waterMl} ml`;
            } else if (waterLiters > 0) {
                waterText = `${waterLiters} litro${waterLiters > 1 ? 's' : ''}`;
            } else {
                waterText = `${waterMl} ml`;
            }

            // Custo financeiro
            const pricePerMl = price / packageSize;
            const batchCost = pureNeededMl * pricePerMl;
            const costPerLiter = batchCost / desiredVolume;

            const formattedCostPerLiter = costPerLiter.toLocaleString('pt-BR', { 
                style: 'currency', 
                currency: 'BRL',
                minimumFractionDigits: 2,
                maximumFractionDigits: 6
            });

            const formattedTotalCost = batchCost.toLocaleString('pt-BR', { 
                style: 'currency', 
                currency: 'BRL',
                minimumFractionDigits: 2,
                maximumFractionDigits: 6
            });

            // Rendimento total da embalagem
            const totalYieldL = packageSize / mlPerLiter;

            // Exibição dos resultados
            document.getElementById('resPure').innerHTML = `<strong>Produto Puro Necessário:</strong> ${pureNeededMl.toFixed(0)} ml`;
            document.getElementById('resWater').innerHTML = `<strong>Água Necessária:</strong> ${waterText}`;
            document.getElementById('resCostPerLiter').innerHTML = `<strong>Custo por Litro da Solução:</strong> ${formattedCostPerLiter}`;
            document.getElementById('resTotalCost').innerHTML = `<strong>Custo Total da Mistura (${desiredVolume}L):</strong> ${formattedTotalCost}`;
            document.getElementById('resYield').innerHTML = `<strong>Rendimento Total da Embalagem:</strong> Até ${totalYieldL.toFixed(0)} litros`;

            document.getElementById('results').classList.remove('hidden');
        }
    </script>
</body>
</html>
